services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: voicechat
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: voicechat_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0 --node-ip 192.168.1.9
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_KEYS: "devkey: devsecret"

volumes:
  pgdata: